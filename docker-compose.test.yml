# Base PostGIS jetable pour la suite d'intégration (Plan 03).
#
#   docker compose -f docker-compose.test.yml up -d
#   cd backend && TEST_DATABASE_URL=postgresql+pg8000://morchid:morchid@localhost:5433/morchid_test pytest -q
#
# Port 5433 : 5432 reste à la base de développement, les deux tournent
# ensemble. Aucun volume nommé — ces données doivent disparaître.
name: morchid-test
services:
  db-test:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: morchid
      POSTGRES_PASSWORD: morchid
      POSTGRES_DB: morchid
    ports:
      # Loopback uniquement : identifiants codés en dur (morchid/morchid) et
      # ce fichier est versionné, donc publics. `127.0.0.1` explicite pour
      # qu'on ne le "simplifie" pas en "5433:5432" plus tard.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U morchid -d morchid"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
