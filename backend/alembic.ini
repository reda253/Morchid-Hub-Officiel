# Configuration Alembic — migrations de la base Morchid Hub.
#
# L'URL de connexion n'est PAS codée ici : elle est résolue dans alembic/env.py
# depuis `settings.DATABASE_URL` (fichier .env), avec possibilité de surcharge via
# la variable d'environnement ALEMBIC_DATABASE_URL (utile pour une base de test).

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url est défini dynamiquement dans env.py (laisser vide).
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
