[pytest]
# Suite de tests du backend Morchid Hub (Plan 03).
#
#   unit/        -> logique métier des services, repositories mockés (aucune BDD)
#   integration/ -> repositories + API sur une vraie base PostGIS de test
#
# Les tests d'intégration sont ignorés automatiquement (skip) si aucune base
# PostgreSQL/PostGIS de test n'est joignable — la couche unit reste exécutable
# partout (dev, CI sans service DB).

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: tests unitaires purs (services, repos mockés, aucune BDD)
    integration: tests nécessitant une vraie base PostGIS de test
    db: alias — accès base de données requis

filterwarnings =
    ignore::DeprecationWarning
